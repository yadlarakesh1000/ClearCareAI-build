spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}   
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clearcareai-mysql}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:myDefaultSecrekddkskmskcsmcskmakxmakMxakmkxmskkcm}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}
  omnidim:
    api-key: ${OMNIDIM_API_KEY:PASTE_YOUR_OMNIDIM_API_KEY_HERE}
    agent-id: ${OMNIDIM_AGENT_ID:208102}
    base-url: ${OMNIDIM_BASE_URL:https://backend.omnidim.io/api/v1}
  fastapi:
    base-url: ${FASTAPI_URL:http://localhost:8000}
  voicereview:
    initial-delay-days: ${VOICE_REVIEW_DELAY_DAYS:7}
    retry-gap-hours: ${VOICE_REVIEW_RETRY_GAP_HOURS:1}
    max-attempts: ${VOICE_REVIEW_MAX_ATTEMPTS:3}
    check-interval-ms: ${VOICE_REVIEW_CHECK_INTERVAL_MS:600000}
